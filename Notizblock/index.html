<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/note.css" />
    <title>Notizblock</title>
  </head>
  <body onload="renderNotes()">
    <header>
      <h1>Notes</h1>
      <div id="content">

      </div>
      <h2>Trash</h2>
      <div id="trash_content">

      </div>
    </header>
    <main>
      <section>
        <h2>Notiz 1</h2>
        <input id="note_input" type="text">
        <button onclick="addNote()">Notiz speichern</button>
      </section>
      <section>
        <h2>Notiz 2</h2>
        <p>Inhalt der zweiten Notiz.</p>
      </section>
      <section>
        <h2>Notiz 3</h2>
        <p>Buttons Styles</p>
      </section>
      <aside>
        <h3>Zusätzliche Infos</h3>
        <p>Hier können Tipps, Links oder andere Hinweise stehen.</p>
      </aside>
    </main>
    <footer>
      <p>&copy; 2025 Notizblock</p>
    </footer>
    <script src="./script.js"></script>
  </body>
</html>
